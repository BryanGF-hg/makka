# ─────────────────────────────────────────────────────────────
# Makka AI — UI estática + proxy al backend uvicorn :8001
# ─────────────────────────────────────────────────────────────

ProxyPreserveHost On
ProxyRequests Off

# ─── Proxy al backend: URL corta (nueva) ────────────────────
ProxyPass        "/makka/ai-api/"  "http://127.0.0.1:8001/"
ProxyPassReverse "/makka/ai-api/"  "http://127.0.0.1:8001/"

# ─── Proxy al backend: URL larga (legacy, por compatibilidad) ──
ProxyPass        "/@CEAC/2DAM/Proyectos-2DAM/makka/002-makka/ai-api/"  "http://127.0.0.1:8001/"
ProxyPassReverse "/@CEAC/2DAM/Proyectos-2DAM/makka/002-makka/ai-api/"  "http://127.0.0.1:8001/"

# ⚠️ NO QUITAR: sin esto, las respuestas de Ollama >60s dan 504
ProxyTimeout 300

<Location "/makka/ai-api/">
    Require all granted
</Location>
<Location "/@CEAC/2DAM/Proyectos-2DAM/makka/002-makka/ai-api/">
    Require all granted
</Location>

# ─── Alias: URL corta /makka para la UI ─────────────────────
Alias /makka "/var/www/html/@CEAC/2DAM/Proyectos-2DAM/makka/002-makka"

<Directory "/var/www/html/@CEAC/2DAM/Proyectos-2DAM/makka/002-makka">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex chat.php
</Directory>

# ⚠️ CRÍTICO: sin esto, /makka/ai/.env es legible por cualquiera
<Directory "/var/www/html/@CEAC/2DAM/Proyectos-2DAM/makka/002-makka/ai">
    Require all denied
</Directory>
